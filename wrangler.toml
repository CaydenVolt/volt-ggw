# Cloudflare Pages project config.
#
# This site is fully static — `npm run build` emits plain HTML/CSS/images into
# `dist/`, and that folder is uploaded as-is. There is no Worker script and no
# Astro adapter, so this file only names the project and pins a compatibility
# date.
#
# Deploy from the CLI with:
#   npm run build
#   npx wrangler pages deploy dist --project-name=volt-template1
#
# Most teams connect the Git repo in the Cloudflare dashboard instead, in which
# case the build command and output directory are set there. See README.

name = "volt-template1"
compatibility_date = "2026-09-23"
pages_build_output_dir = "dist"

# ── Cloudflare Pages Functions ───────────────────────────────────────────────
# If you later add `functions/api/lead.ts` to proxy the GoHighLevel call (so the
# API token stays server-side), Pages picks it up automatically — no adapter and
# no change to this file. Set secrets with:
#
#   npx wrangler pages secret put GHL_API_TOKEN --project-name=volt-template1
#
# For local development of a Function, put the same values in `.dev.vars`
# (gitignored). See `.env.example`.
